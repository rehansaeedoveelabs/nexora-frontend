<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexora</title>

  <!-- Public client ID (not a secret). Replace with your app's API key from the Dev Dashboard. -->
  <meta name="shopify-api-key" content="REPLACE_WITH_SHOPIFY_API_KEY">

  <!-- App Bridge must be the first script so it can initialize before anything else. -->
  <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
  <script src="https://cdn.shopify.com/shopifycloud/polaris.js"></script>

  <!--
    Import map: lets `import { useState } from 'react'` work in the browser with no Node and no bundler.
    Versions are pinned exactly. `external` keeps a single shared React instance across packages.
  -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@19.2.9",
      "react-dom": "https://esm.sh/react-dom@19.2.9?external=react",
      "react-dom/client": "https://esm.sh/react-dom@19.2.9/client?external=react",
      "react-router": "https://esm.sh/react-router@7.18.4?external=react,react-dom",
      "htm": "https://esm.sh/htm@3.1.1"
    }
  }
  </script>

  <link rel="stylesheet" href="/src/styles.css">
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <!-- Admin sidebar menu, read by App Bridge. Clicks are routed by React Router (see App.js). -->
  <s-app-nav>
    <s-link href="/" rel="home">Home</s-link>
    <s-link href="/locations">Locations</s-link>
  </s-app-nav>

  <div id="app"></div>

  <noscript>Nexora needs JavaScript enabled to run inside Shopify admin.</noscript>
</body>
</html>
